

# cursor customization
cursor_shape block
cursor_blink_interval 0.6
cursor_stop_blinking_after 20
shell_integration no-cursor

window_margin_width 4
window_padding_width 4
background_opacity .6

window_border_width 0pt
active_tab_foreground   #000
active_tab_background   #eee
active_tab_font_style   bold
inactive_tab_foreground #fff
inactive_tab_background #000
inactive_tab_font_style normal
tab_title_template " {title}"
tab_separator "|"
tab_bar_style separator

# BEGIN_KITTY_FONTS
font_family     Agave Nerd Font Mono
italic_font     Source Code Pro Italic
bold_font       Agave Nerd Font Mono Bold
bold_italic_fontVictorMono Nerf Font Bold Italic
# END_KITTY_FONTS

